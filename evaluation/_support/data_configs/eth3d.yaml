name: eth3d
display_name: ETH3D
source: "ETH3D high-res benchmark, laser-scanned GT"

is_metric: true
participate_scale_factor: true
scale_type: metric

depth_key: depth
has_moge_mask: false
has_sky_mask: false
has_dynamic_mask: false

view_sampling: covisibility
covisibility_version: v0
covisibility_threshold: 0.025       # few frames, wide baseline; threshold relaxed (aligned with map-anything)

apply_moge_mask: false
apply_sky_mask: false
clip_depth_p95: false

camera_convention: opencv
varying_intrinsics: false

# Data mixing strategy (aligned with MoGe-v2)
quality_tier: B                # A=synthetic / B=laser reconstruction / C=SfM pseudo-GT
sampling_weight: 0.1              # multinomial sampling weight

notes: |
  True metric dataset with laser-scanned GT, often used as high-quality supervision.
  Few frames per scene and wide baselines; covisibility threshold lowered from 0.25 to 0.025.
